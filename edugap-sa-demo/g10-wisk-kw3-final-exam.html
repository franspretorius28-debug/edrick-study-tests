function hashStr(s){let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h+= (h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);} return h>>>0;}
function rng(seed){let x=seed>>>0; return function(){x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%100000)/100000}}
function shuffle(a, seed){let r=rng(seed); let b=a.slice(); for(let i=b.length-1;i>0;i--){let j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b;}

function cleanText(x){
  return String(x||'').replace(/\s+/g,' ').trim();
}

function norm(x){
  return cleanText(x).toLowerCase();
}

function unique(arr){
  let out = [];
  arr.forEach(x=>{
    x = cleanText(x);
    if(x && !out.includes(x)) out.push(x);
  });
  return out;
}

function packOptions(q, wrongs, seed){
  let ans = cleanText(q.answer);
  let opts = unique([ans].concat(wrongs)).filter(x => x && x !== 'undefined');

  opts = opts.filter(x => {
    let bad = ['Geen van bogenoemde','Kan nie bepaal word nie','Dieselfde as die vraag','Net ’n skatting','Verkeerde opsie'];
    return !bad.some(b => x.includes(b));
  });

  if(opts.length < 4){
    opts = opts.concat(makeFallbackWrong(q, opts));
  }

  opts = unique(opts).slice(0,4);
  while(opts.length < 4){
    opts.push('’n Ander redelike maar verkeerde antwoord');
  }

  return shuffle(opts, seed);
}

function numericDistractors(q){
  let ans = cleanText(q.answer);
  let m = ans.match(/R?\s*([0-9]+(?:[ ][0-9]{3})*(?:[,.][0-9]+)?)/);
  if(!m) return [];

  let val = parseFloat(m[1].replace(/ /g,'').replace(',', '.'));
  if(!isFinite(val)) return [];

  let unit = '';
  let um = ans.match(/(cm²|m²|mm²|cm|m|mm|kg|ml|L|%|blikkies|lae|pale|droppers|vensters|deure|skroewe)$/);
  if(um) unit = ' ' + um[1];

  function fmt(v){
    v = Math.round(v * 100) / 100;
    let s = String(v).replace('.', ',');
    if(ans.trim().startsWith('R')) s = 'R' + s;
    return s + unit;
  }

  let t = norm(q.q);
  let vals = [];

  if(t.includes('totale') || t.includes('altesaam')){
    vals = [val + 10, Math.max(0,val - 10), val * 2, Math.max(0,val / 2)];
  } else if(t.includes('persentasie') || ans.includes('%')){
    vals = [val + 1, Math.max(0,val - 1), val + 5, Math.max(0,val - 5)];
  } else if(t.includes('omtrek')){
    vals = [val / 2, val * 2, val + 4, Math.max(0,val - 4)];
  } else if(t.includes('oppervlakte')){
    vals = [val / 2, val * 2, val + 20, Math.max(0,val - 20)];
  } else if(ans.trim().startsWith('R')){
    vals = [val * 0.9, val * 1.1, val + 100, Math.max(0,val - 100)];
  } else {
    vals = [val + 1, Math.max(0,val - 1), val * 2, Math.max(0,val / 2)];
  }

  return unique(vals.map(fmt)).filter(x => x !== ans);
}

function answerPoolDistractors(q, current){
  let pool = [];
  try{
    if(window.G10_WISK_KW3_TASKS){
      G10_WISK_KW3_TASKS.forEach(t => (t.questions||[]).forEach(qq => {
        if(qq && qq.answer) pool.push(cleanText(qq.answer));
      }));
    }
  }catch(e){}

  let ans = cleanText(current);
  pool = unique(pool).filter(x => x && x !== ans);

  let qwords = norm(q.q).split(/[^a-z0-9êëéèáàíïóöúü]+/).filter(w => w.length > 4);
  pool.sort((a,b)=>{
    let aa = norm(a), bb = norm(b);
    let sa = qwords.filter(w => aa.includes(w)).length;
    let sb = qwords.filter(w => bb.includes(w)).length;
    return sb - sa;
  });

  return pool.slice(0,8);
}

function makeOptions(q, seed){
  let wrongs = [];

  if(q.options && q.options.length >= 4){
    return shuffle(q.options.map(cleanText), seed);
  }

  if(q.wrong && q.wrong.length){
    wrongs = wrongs.concat(q.wrong);
  }

  wrongs = wrongs
    .concat(specificWrong(q))
    .concat(numericDistractors(q))
    .concat(answerPoolDistractors(q, q.answer))
    .concat(makeFallbackWrong(q, []));

  return packOptions(q, wrongs, seed);
}

    c.innerHTML+=html;
  });

  c.innerHTML+='<button class="btn" id="markBtn">Merk '+paper.title+'</button><p id="result" class="score"></p>';
  app.appendChild(c);

  document.querySelectorAll('.option').forEach(b=>b.onclick=choose);
  document.getElementById('markBtn').onclick=mark;
  updateBar();
}
function choose(e){if(locked)return; const uid=e.currentTarget.dataset.uid; answers[uid]=e.currentTarget.dataset.val; document.querySelectorAll(`[data-uid="${uid}"]`).forEach(x=>x.style.background='#f9fafb'); e.currentTarget.style.background='#dff7e5'; updateBar();}
function updateBar(){document.getElementById('bar').style.width=(Object.keys(answers).length/(questions.length||1)*100)+'%';}
async function mark(){locked=true; let score=0; questions.forEach(qu=>{let chosen=answers[qu.uid]; let ok=chosen===qu.answer; if(ok) score++; document.querySelectorAll(`[data-uid="${qu.uid}"]`).forEach(b=>{if(b.dataset.val===qu.answer)b.classList.add('correct'); else if(b.dataset.val===chosen)b.classList.add('wrong');}); document.getElementById('exp_'+qu.uid).textContent=(ok?'Reg: ':'Regte antwoord: ')+qu.answer; }); document.getElementById('result').textContent=`${currentPaper().title} punt: ${score} / ${questions.length}`; await saveFinal(score,questions.length,answers); window.scrollTo(0,0);}
document.getElementById('start').onclick=startExam;
</script></body></html>
