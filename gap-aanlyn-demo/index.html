<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAP Aanlyn – Exact Demo Match</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="exact-body">
  <div class="top-note">
    <span>Exact visual demo layout</span>
    <span class="dot"></span>
    <span>Desktop & mobile friendly preview</span>
  </div>

  <main class="reference-wrapper">
    <div class="reference-stage" id="stage">
      <img src="homepage-reference.png" alt="GAP Aanlyn premium demo reference" class="reference-image">

      <!-- top nav -->
      <a class="hotspot hs-home" href="#top" title="Home"></a>
      <a class="hotspot hs-info" href="#top" title="Information"></a>
      <a class="hotspot hs-forms" href="#top" title="Forms"></a>
      <a class="hotspot hs-programs" href="#top" title="Programs"></a>
      <a class="hotspot hs-downloads" href="#top" title="Downloads"></a>
      <a class="hotspot hs-subjects" href="#top" title="Subjects"></a>
      <a class="hotspot hs-marketing" href="#top" title="Marketing"></a>
      <a class="hotspot hs-centres" href="#top" title="Centres"></a>
      <a class="hotspot hs-sponsors" href="#top" title="Sponsors"></a>

      <a class="hotspot hs-portal-top" href="portal.html" title="Portal"></a>
      <button class="hotspot hs-lang" onclick="toggleLangToast()" title="Afrikaans | English"></button>

      <!-- hero buttons -->
      <button class="hotspot hs-view-demo" onclick="openVideo('youtube')" title="View Demo"></button>
      <button class="hotspot hs-watch-intro" onclick="openVideo('youtube')" title="Watch Intro"></button>
      <a class="hotspot hs-open-portal" href="portal.html" title="Open Portal"></a>

      <!-- language strip -->
      <button class="hotspot hs-lang-strip" onclick="toggleLangToast()" title="Switch language"></button>

      <!-- videos -->
      <button class="hotspot hs-video-1" onclick="openVideo('youtube')" title="Welcome to GAP"></button>
      <button class="hotspot hs-video-2" onclick="openVideo('portal')" title="Portal Walkthrough"></button>
      <button class="hotspot hs-video-3" onclick="openVideo('parents')" title="How Parents Track Progress"></button>
      <button class="hotspot hs-video-4" onclick="openVideo('tasks')" title="How Assignments & Tests Work"></button>
      <button class="hotspot hs-view-all" onclick="openVideo('youtube')" title="View all videos"></button>

      <!-- portal section buttons -->
      <a class="hotspot hs-portal-open-2" href="portal.html" title="Open Portal"></a>
      <button class="hotspot hs-view-demo-2" onclick="openVideo('portal')" title="View Demo"></button>

      <!-- CTA -->
      <button class="hotspot hs-enquire" onclick="scrollToContact()" title="Enquire Now"></button>
      <button class="hotspot hs-pricing" onclick="showToast('Pricing section can be connected in the final live build.')" title="View Pricing"></button>

      <!-- contact -->
      <button class="hotspot hs-contact-send" onclick="showToast('Demo enquiry submitted — in the final build this will connect to email / WhatsApp / forms.')" title="Send Enquiry"></button>

      <!-- whatsapp -->
      <a class="hotspot hs-whatsapp" href="https://wa.me/" target="_blank" title="Chat on WhatsApp"></a>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <div id="videoModal" class="video-modal" aria-hidden="true">
    <div class="video-modal-backdrop" onclick="closeVideoModal()"></div>
    <div class="video-modal-panel">
      <button class="modal-close" onclick="closeVideoModal()">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
