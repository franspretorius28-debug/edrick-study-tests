<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAP Aanlyn – Exact Visual Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="stage" id="top">
      <img src="gap-demo-exact.png" alt="GAP Aanlyn professional website demo" class="exact-img">

      <!-- Header / navigation clickable zones -->
      <a class="hotspot hs-home" href="#top" aria-label="Home"></a>
      <button class="hotspot hs-info" onclick="toast('Information page preview can be added in the full build.')" aria-label="Information"></button>
      <button class="hotspot hs-forms" onclick="toast('Forms can connect to registration, province forms and enquiries.')" aria-label="Forms"></button>
      <button class="hotspot hs-programs" onclick="toast('Programs page can link to Android, Windows and portal access.')" aria-label="Programs"></button>
      <button class="hotspot hs-downloads" onclick="toast('Downloads can contain printable documents and resources.')" aria-label="Downloads"></button>
      <button class="hotspot hs-subjects" onclick="toast('Subjects page can list all 2026 subjects neatly.')" aria-label="Subjects"></button>
      <button class="hotspot hs-marketing" onclick="toast('Marketing page can be redesigned professionally.')" aria-label="Marketing"></button>
      <button class="hotspot hs-centres" onclick="toast('Centres page can show all locations in a modern directory.')" aria-label="Centres"></button>
      <button class="hotspot hs-sponsors" onclick="toast('Sponsors page can show partners and projects beautifully.')" aria-label="Sponsors"></button>

      <a class="hotspot hs-portal-top" href="portal.html" aria-label="Open Portal"></a>
      <button class="hotspot hs-lang-top" onclick="toast('Language changed: Afrikaans | English demo')" aria-label="Language Switch"></button>

      <!-- Hero buttons -->
      <button class="hotspot hs-view-demo" onclick="openVideo('youtube')" aria-label="View Demo"></button>
      <button class="hotspot hs-watch-intro" onclick="openVideo('youtube')" aria-label="Watch Intro"></button>
      <a class="hotspot hs-open-portal" href="portal.html" aria-label="Open Portal"></a>
      <button class="hotspot hs-lang-strip" onclick="toast('This shows where users switch instantly between Afrikaans and English.')" aria-label="Switch Language"></button>

      <!-- Video centre -->
      <button class="hotspot hs-video1" onclick="openVideo('youtube')" aria-label="Welcome to GAP"></button>
      <button class="hotspot hs-video2" onclick="openVideo('portal')" aria-label="Portal Walkthrough"></button>
      <button class="hotspot hs-video3" onclick="openVideo('parents')" aria-label="How Parents Track Progress"></button>
      <button class="hotspot hs-video4" onclick="openVideo('tasks')" aria-label="How Assignments and Tests Work"></button>
      <button class="hotspot hs-view-all" onclick="openVideo('youtube')" aria-label="View all videos"></button>

      <!-- Portal preview -->
      <a class="hotspot hs-open-portal2" href="portal.html" aria-label="Open Portal Demo"></a>
      <button class="hotspot hs-view-demo2" onclick="openVideo('portal')" aria-label="View Portal Demo"></button>

      <!-- CTA / contact -->
      <button class="hotspot hs-enquire" onclick="toast('Enquiry button can connect to WhatsApp, email or a form submission.')" aria-label="Enquire Now"></button>
      <button class="hotspot hs-pricing" onclick="toast('Pricing package can be added here in the final website.')" aria-label="View Pricing"></button>
      <button class="hotspot hs-send" onclick="toast('Demo enquiry submitted. In the real site this sends to email or WhatsApp.')" aria-label="Send Enquiry"></button>
      <a class="hotspot hs-whatsapp" href="https://wa.me/" target="_blank" aria-label="WhatsApp"></a>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <div id="videoModal" class="modal" aria-hidden="true">
    <div class="modal-bg" onclick="closeVideo()"></div>
    <div class="modal-box">
      <button class="modal-close" onclick="closeVideo()">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
